{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block content %}
<section class="page-head"><div><span class="eyebrow">STUDENT DIRECTORY</span><h1>Add a <em>student</em></h1><p>Fields marked * are required.</p></div><a class="btn btn-soft" href="{{ url_for('students') }}">← Back to students</a></section>
<section class="panel form-panel"><form method="post" class="student-form">
  <label>Full name *<input name="name" required maxlength="100" placeholder="Enter student name"></label>
  <label>Roll number *<input name="roll_no" required maxlength="40" placeholder="e.g. BCA-2026-001"></label>
  <label>Course *<select name="course" required><option value="">Select course</option><option>BCA</option><option>BBA</option><option>BA</option><option>B.Com</option><option>B.Sc</option><option>Other</option></select></label>
  <label>Semester *<select name="semester" required><option value="">Select semester</option>{% for i in range(1, 9) %}<option>{{ i }}</option>{% endfor %}</select></label>
  <label class="full-field">Email (optional)<input name="email" type="email" maxlength="150" placeholder="student@example.com"></label>
  <div class="full-field form-actions"><button class="btn btn-primary" type="submit">Save student</button><a class="btn btn-soft" href="{{ url_for('students') }}">Cancel</a></div>
</form></section>
{% endblock %}
