 
{% extends "base.html" %}

{% block title %}Student Registration{% endblock %}

{% block content %}

<section class="page-head">
    <div>
        <span class="eyebrow">JOIN OUR COLLEGE</span>
        <h1>Student <em>Registration</em></h1>
    </div>
</section>

<section class="panel">
    <form method="POST" action="{{ url_for('add_student') }}" class="student-form">

        <div>
            <label>Student Name</label>
            <input type="text" name="name" placeholder="Enter student name" required>
        </div>

        <div>
            <label>Roll Number</label>
            <input type="text" name="roll_no" placeholder="Enter roll number" required>
        </div>

        <div>
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter email address">
        </div>

        <div>
            <label>Course</label>
            <select name="course" required>
                <option value="">Select Course</option>
                <option value="BCA">BCA</option>
                <option value="BA">BA</option>
                <option value="BCom">B.Com</option>
                <option value="BSc">B.Sc</option>
            </select>
        </div>

        <div>
            <label>Semester</label>
            <select name="semester" required>
                <option value="">Select Semester</option>
                <option value="1">1st Semester</option>
                <option value="2">2nd Semester</option>
                <option value="3">3rd Semester</option>
                <option value="4">4th Semester</option>
                <option value="5">5th Semester</option>
                <option value="6">6th Semester</option>
            </select>
        </div>

        <div class="full-field">
            <button type="submit" class="btn">Submit Registration</button>
        </div>

    </form>
</section>

{% endblock %}
